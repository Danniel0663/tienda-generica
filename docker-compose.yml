name: ${COMPOSE_PROJECT_NAME:-tienda-generica-react-nginx}

x-app-common: &app-common
  restart: unless-stopped
  environment:
    SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/tienda_generica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
    SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
    SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
    APP_SECURITY_TOKEN_SECRET: ${APP_SECURITY_TOKEN_SECRET:-change-this-secret-in-production-32-characters}
  depends_on:
    mysql:
      condition: service_healthy

x-gateway-env: &gateway-env
  SERVER_PORT: 8081
  SERVICES_USUARIOS_BASE_URL: http://usuarios-service:8082
  SERVICES_CLIENTES_BASE_URL: http://clientes-service:8083
  SERVICES_PROVEEDORES_BASE_URL: http://proveedores-service:8084
  SERVICES_PRODUCTOS_BASE_URL: http://productos-service:8085
  SERVICES_VENTAS_BASE_URL: http://ventas-service:8086
  SERVICES_REPORTES_BASE_URL: http://report-service:8087
  APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}

x-gateway-service: &gateway-service
  image: tienda-generica-gateway:local
  restart: unless-stopped
  environment: *gateway-env
  expose:
    - "8081"
  depends_on:
    - usuarios-service
    - clientes-service
    - proveedores-service
    - productos-service
    - ventas-service
    - report-service

x-frontend-service: &frontend-service
  image: tienda-generica-frontend:local
  restart: unless-stopped
  environment:
    GATEWAY_HOSTPORT: backend-load-balancer
  expose:
    - "80"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tienda_generica}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./microservices/domain-kernel/src/main/resources/db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    ports:
      - "${MYSQL_PUBLIC_BIND:-127.0.0.1}:${MYSQL_PUBLIC_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  usuarios-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: microservices/usuarios-service
        ARTIFACT_NAME: usuarios-service-0.0.1-SNAPSHOT.war
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/tienda_generica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      APP_SECURITY_TOKEN_SECRET: ${APP_SECURITY_TOKEN_SECRET:-change-this-secret-in-production-32-characters}
    expose:
      - "8082"

  clientes-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: microservices/clientes-service
        ARTIFACT_NAME: clientes-service-0.0.1-SNAPSHOT.war
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/tienda_generica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      APP_SECURITY_TOKEN_SECRET: ${APP_SECURITY_TOKEN_SECRET:-change-this-secret-in-production-32-characters}
    expose:
      - "8083"

  proveedores-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: microservices/proveedores-service
        ARTIFACT_NAME: proveedores-service-0.0.1-SNAPSHOT.war
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/tienda_generica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      APP_SECURITY_TOKEN_SECRET: ${APP_SECURITY_TOKEN_SECRET:-change-this-secret-in-production-32-characters}
    expose:
      - "8084"

  productos-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: microservices/productos-service
        ARTIFACT_NAME: productos-service-0.0.1-SNAPSHOT.war
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/tienda_generica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      APP_SECURITY_TOKEN_SECRET: ${APP_SECURITY_TOKEN_SECRET:-change-this-secret-in-production-32-characters}
    expose:
      - "8085"

  ventas-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: microservices/ventas-service
        ARTIFACT_NAME: ventas-service-0.0.1-SNAPSHOT.war
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/tienda_generica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      APP_SECURITY_TOKEN_SECRET: ${APP_SECURITY_TOKEN_SECRET:-change-this-secret-in-production-32-characters}
    expose:
      - "8086"

  report-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: microservices/report-service
        ARTIFACT_NAME: report-service-0.0.1-SNAPSHOT.jar
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/tienda_generica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      APP_SECURITY_TOKEN_SECRET: ${APP_SECURITY_TOKEN_SECRET:-change-this-secret-in-production-32-characters}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    expose:
      - "8087"

  gateway-service:
    <<: *gateway-service
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: microservices/gateway-service
        ARTIFACT_NAME: gateway-service-0.0.1-SNAPSHOT.war

  gateway-service-2:
    <<: *gateway-service
    depends_on:
      - gateway-service
      - usuarios-service
      - clientes-service
      - proveedores-service
      - productos-service
      - ventas-service
      - report-service

  backend-load-balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${BACKEND_PUBLIC_BIND:-0.0.0.0}:${BACKEND_PUBLIC_PORT:-8081}:80"
    volumes:
      - ./infra/nginx/backend-load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-service
      - gateway-service-2

  frontend-1:
    <<: *frontend-service
    build:
      context: ./frontend
      dockerfile: Dockerfile

  frontend-2:
    <<: *frontend-service
    depends_on:
      - frontend-1

  frontend-load-balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${FRONTEND_PUBLIC_BIND:-0.0.0.0}:${FRONTEND_PUBLIC_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/frontend-load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-1
      - frontend-2
      - backend-load-balancer

volumes:
  mysql_data:

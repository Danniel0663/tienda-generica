services:
  - type: web
    name: mostrador-portafolio
    runtime: docker
    plan: free
    dockerfilePath: ./portfolio/Dockerfile
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: APP_SECURITY_TOKEN_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: AIVEN_CA_PEM
        sync: false

        value: "8081"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: USUARIOS_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: tienda-generica-usuarios
          property: hostport
      - key: CLIENTES_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: tienda-generica-clientes
          property: hostport
      - key: PROVEEDORES_SERVICE_HOSTPORT
        fromService:
          type: pserv

services:
  - type: web
    name: tienda-generica-frontend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: GATEWAY_HOSTPORT
        fromService:
          type: pserv
          name: tienda-generica-gateway
          property: hostport

  - type: pserv
    name: tienda-generica-mysql
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./infra/render/mysql/Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: tienda_generica
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: pserv
    name: tienda-generica-usuarios
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.service
    dockerContext: .
    dockerCommand: /bin/sh /app/scripts/render/start-domain-service.sh
    autoDeployTrigger: off
    envVars:
      - key: SERVER_PORT
        value: "8082"
      - key: MYSQL_DATABASE
        value: tienda_generica
      - key: MYSQL_HOSTPORT
        fromService:
          type: pserv
          name: tienda-generica-mysql
          property: hostport
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        fromService:
          type: pserv
          name: tienda-generica-mysql
          envVarKey: MYSQL_ROOT_PASSWORD
      - key: APP_SECURITY_TOKEN_SECRET
        fromGroup: tienda-generica-shared
      - key: MODULE_PATH
        value: microservices/usuarios-service
      - key: ARTIFACT_NAME
        value: usuarios-service-0.0.1-SNAPSHOT.war

  - type: pserv
    name: tienda-generica-clientes
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.service

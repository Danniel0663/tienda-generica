      - key: SERVER_PORT
        value: "8083"
      - key: MYSQL_DATABASE
        value: tienda_generica
      - key: MYSQL_HOSTPORT
        fromService:
          type: pserv
          name: tienda-generica-mysql
          property: hostport
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        fromService:
          type: pserv
          name: tienda-generica-mysql
          envVarKey: MYSQL_ROOT_PASSWORD
      - key: APP_SECURITY_TOKEN_SECRET
        fromGroup: tienda-generica-shared
      - key: MODULE_PATH
        value: microservices/clientes-service
      - key: ARTIFACT_NAME
        value: clientes-service-0.0.1-SNAPSHOT.war

  - type: pserv
    name: tienda-generica-proveedores
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.service
    dockerContext: .
    dockerCommand: /bin/sh /app/scripts/render/start-domain-service.sh
    autoDeployTrigger: off

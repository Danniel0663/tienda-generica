          name: tienda-generica-ventas
          property: hostport
      - key: REPORT_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: tienda-generica-reportes
          property: hostport
      - key: MODULE_PATH
        value: microservices/gateway-service
      - key: ARTIFACT_NAME
        value: gateway-service-0.0.1-SNAPSHOT.war

envVarGroups:
  - name: tienda-generica-shared
    envVars:
      - key: APP_SECURITY_TOKEN_SECRET
        generateValue: true

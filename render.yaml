      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        fromService:
          type: pserv
          name: tienda-generica-mysql
          envVarKey: MYSQL_ROOT_PASSWORD
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: APP_SECURITY_TOKEN_SECRET

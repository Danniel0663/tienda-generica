apiVersion: v1
kind: Service
metadata:
  name: usuarios-service
spec:
  selector:
    app.kubernetes.io/component: usuarios-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: usuarios-service
  template:
    metadata:
      labels:
        app.kubernetes.io/component: usuarios-service
    spec:
      containers:
        - name: usuarios-service
          image: tienda-generica/usuarios-service:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: tienda-generica-config
            - secretRef:
                name: tienda-generica-secrets
          env:
            - name: SERVER_PORT
              value: "8082"
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              memory: 768Mi
---

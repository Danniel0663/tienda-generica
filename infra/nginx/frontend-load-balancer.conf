upstream frontend_pool {
    server frontend-1:80;
    server frontend-2:80;
}

server {
    listen 80;
    server_name _;

    add_header X-Frontend-Load-Balancer $hostname always;
    add_header X-Frontend-Upstream $upstream_addr always;

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://backend-load-balancer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        add_header X-Frontend-Load-Balancer $hostname always;
        add_header X-Frontend-Upstream $upstream_addr always;
    }

    location / {
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        add_header X-Frontend-Load-Balancer $hostname always;
        add_header X-Frontend-Upstream $upstream_addr always;
    }
}

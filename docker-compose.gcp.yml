services:
  mysql:
    ports:
      - "${MYSQL_PUBLIC_BIND:-127.0.0.1}:${MYSQL_PUBLIC_PORT:-3306}:3306"

  usuarios-service:
    build:
      dockerfile: Dockerfile.service.prebuilt

  clientes-service:
    build:
      dockerfile: Dockerfile.service.prebuilt

  proveedores-service:
    build:
      dockerfile: Dockerfile.service.prebuilt

  productos-service:
    build:
      dockerfile: Dockerfile.service.prebuilt

  ventas-service:
    build:
      dockerfile: Dockerfile.service.prebuilt

  report-service:
    build:
      dockerfile: Dockerfile.service.prebuilt

  gateway-service:
    build:
      dockerfile: Dockerfile.service.prebuilt

  frontend-1:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt

  backend-load-balancer:
    ports:
      - "${BACKEND_PUBLIC_BIND:-127.0.0.1}:${BACKEND_PUBLIC_PORT:-8081}:80"

  frontend-load-balancer:
    ports:
      - "${FRONTEND_PUBLIC_BIND:-0.0.0.0}:${FRONTEND_PUBLIC_PORT:-80}:80"

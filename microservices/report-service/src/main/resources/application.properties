spring.application.name=report-service
server.port=${SERVER_PORT:8087}
server.shutdown=graceful

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tienda_generica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never

app.security.token-secret=${APP_SECURITY_TOKEN_SECRET:change-this-secret-in-production-32-characters}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=Tienda Generica Report Service
info.app.description=Microservicio de reportes operativos y consultas analiticas.

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

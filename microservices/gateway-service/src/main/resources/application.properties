spring.application.name=gateway-service
server.port=${SERVER_PORT:8081}
server.shutdown=graceful

services.usuarios.base-url=${SERVICES_USUARIOS_BASE_URL:http://localhost:8082}
services.clientes.base-url=${SERVICES_CLIENTES_BASE_URL:http://localhost:8083}
services.proveedores.base-url=${SERVICES_PROVEEDORES_BASE_URL:http://localhost:8084}
services.productos.base-url=${SERVICES_PRODUCTOS_BASE_URL:http://localhost:8085}
services.ventas.base-url=${SERVICES_VENTAS_BASE_URL:http://localhost:8086}
services.reportes.base-url=${SERVICES_REPORTES_BASE_URL:http://localhost:8087}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=Tienda Generica Gateway Service
info.app.description=Gateway HTTP para usuarios, clientes, proveedores, productos y ventas.

logging.level.org.springframework.web=INFO

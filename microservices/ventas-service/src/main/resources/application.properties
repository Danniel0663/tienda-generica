spring.application.name=ventas-service
server.port=${SERVER_PORT:8086}
server.shutdown=graceful

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tienda_generica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.security.token-secret=${APP_SECURITY_TOKEN_SECRET:change-this-secret-in-production-32-characters}
app.security.token-ttl=8h

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=Tienda Generica Ventas Service
info.app.description=Microservicio de ventas.

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

services:
  gateway-service:
    environment:
      SERVICES_USUARIOS_BASE_URLS: http://usuarios-service:8082,http://usuarios-service-2:8082
      SERVICES_CLIENTES_BASE_URLS: http://clientes-service:8083,http://clientes-service-2:8083
      SERVICES_PROVEEDORES_BASE_URLS: http://proveedores-service:8084,http://proveedores-service-2:8084
      SERVICES_PRODUCTOS_BASE_URLS: http://productos-service:8085,http://productos-service-2:8085
      SERVICES_VENTAS_BASE_URLS: http://ventas-service:8086,http://ventas-service-2:8086
      SERVICES_REPORTES_BASE_URLS: http://report-service:8087,http://report-service-2:8087

  usuarios-service-2:
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: microservices/usuarios-service
        ARTIFACT_NAME: usuarios-service-0.0.1-SNAPSHOT.war
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tienda_generica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_SECURITY_TOKEN_SECRET: change-this-secret-in-production-32-characters
    expose:
      - "8082"
    depends_on:
      mysql:
        condition: service_healthy

  clientes-service-2:
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: microservices/clientes-service
